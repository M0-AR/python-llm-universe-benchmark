[project]
name = "python-llm-universe-benchmark"
version = "0.1.0"
description = "Universe-class reproducible benchmark for Python + LLMs: from book basics to PhD-ready hidden patterns (token bias, contamination, sequential Bayes, IRT anchors, hallucination lifecycle, cost/latency). 2026-2027 best practices."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Universe Benchmark Team" }]
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[tool.ruff]
line-length = 100
